[project]
name = "databridge"
authors = [
    { name = "Faircode Infotech", email = "anandu@faircodetech.com"}
]
description = "Universal data migration and synchronization for Frappe applications"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe" is installed and managed by bench.
    "defusedxml~=0.7.1",
    "openpyxl>=3.1",
    "pymysql>=1.1",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
pytest = ">=8"

[deploy.dependencies.apt]
packages = []

[tool.pytest.ini_options]
testpaths = ["databridge/tests"]
python_files = ["test_unit_*.py"]
# Integration tests (test_integration_*.py) need a site and run through `bench run-tests`.
# pytest only collects the pure unit tests (test_unit_*.py).
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", "B018", "B023", "B904", "E101", "E402", "E501", "E741", "F401", "F403", "F405", "F722",
    "W191", "UP030", "UP031", "UP032", "UP037", "UP040", "RUF012",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"databridge/tests/*" = ["RUF015"]
